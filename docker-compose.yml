services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "DogWalking@2024"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql

  api:
    build:
      context: .
      dockerfile: DogWalking.Api/Dockerfile
    ports:
      - "5026:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=Server=sqlserver;Database=DogWalkingApp;User Id=sa;Password=DogWalking@2024;TrustServerCertificate=True
    depends_on:
      - sqlserver

volumes:
  sqldata:
